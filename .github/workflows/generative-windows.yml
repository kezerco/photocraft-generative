# Fork development build: an unsigned portable app to test Generative Fill on Windows.
name: Generative Fill Windows

on:
  push:
    branches: [feature/generative-fill-fal, main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    # Keep the VC runtime static as in the upstream Windows portable package.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check and test engine
        run: |
          cargo check --locked -p photocraft-ui-egui -p photocraft-engine
          cargo test --locked -p photocraft-engine --lib generative_cmds
          cargo test --locked -p photocraft-engine --lib fal_client
          cargo test --locked -p photocraft-engine --lib fal_key
          cargo test --locked -p photocraft-ui-egui --lib generative_key_ui
          cargo test --locked -p photocraft-ui-egui --lib right_click_generative_fill_opens_dialog_without_spending
      - name: Windows lint checks
        run: cargo clippy --locked -p photocraft-engine -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Build desktop app
        run: cargo build --release --locked -p photocraft --target x86_64-pc-windows-msvc
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $exe = Resolve-Path target/x86_64-pc-windows-msvc/release/photocraft.exe
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "PhotoCraft --version exited with $($process.ExitCode)" }
      - name: Stage portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/photocraft.exe dist/portable/
          Copy-Item packaging/windows/portable.txt dist/portable/
          Copy-Item packaging/windows/README-GENERATIVE.txt dist/portable/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE dist/portable/
      - name: Upload unsigned portable build
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-generative-windows-x64-unsigned
          path: dist/portable/*
          if-no-files-found: error
